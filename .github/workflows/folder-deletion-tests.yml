name: Folder deletion regression checks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recovery_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U recovery_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: flask-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save jsdom@30.1.0 exceljs@4.4.0 playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest -v test_app
      - run: node test_frontend.cjs
      - run: python test_postgres.py
        env:
          TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - run: node test_deletion_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-browser-screenshots
          path: flask-app/test-browser-output/*.png
