name: Scheduling regression checks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recovery_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U recovery_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: flask-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save jsdom@30.1.0 exceljs@4.4.0 playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest -v test_app test_boundary 2>&1 | tee test-backend.log
        if: ${{ !cancelled() }}
      - run: node test_frontend.cjs 2>&1 | tee test-frontend.log
        if: ${{ !cancelled() }}
      - run: python test_postgres.py 2>&1 | tee test-postgres.log
        if: ${{ !cancelled() }}
        env:
          TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
      - run: node test_deletion_browser.cjs 2>&1 | tee test-browser.log
        if: ${{ !cancelled() }}
      - run: node test_boundary_browser.cjs 2>&1 | tee test-boundary-browser.log
        if: ${{ !cancelled() }}
      - run: node test_supervisor_availability_browser.cjs 2>&1 | tee test-supervisor-browser.log
        if: ${{ !cancelled() }}
      - run: python verify.py 2>&1 | tee test-solver.log
        if: ${{ !cancelled() }}
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            for (const kind of ['backend','frontend','postgres','browser','boundary-browser','supervisor-browser','solver']) {
              const path = `flask-app/test-${kind}.log`;
              if (fs.existsSync(path)) summary += `### ${kind}\n\n\`\`\`text\n${fs.readFileSync(path,'utf8').slice(-13000)}\n\`\`\`\n\n`;
            }
            const ref = context.payload.pull_request?.head.sha || context.sha;
            const {data} = await github.rest.checks.listForRef({...context.repo,ref});
            const check = data.check_runs.filter(c=>c.name==='regression' && c.app.slug==='github-actions').sort((a,b)=>b.id-a.id)[0];
            if (check) await github.rest.checks.update({...context.repo,check_run_id:check.id,
              output:{title:'Disposable database and browser test logs',summary:summary.slice(-60000)}});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-browser-screenshots
          path: flask-app/test-browser-output/*.png
