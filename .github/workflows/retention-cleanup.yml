name: Daily scheduling retention

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first; apply permanently deletes eligible scheduling records
        type: choice
        options: [preview, apply]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: production-retention
  cancel-in-progress: false

jobs:
  cleanup:
    # Never expose production secrets to a PR or a manually selected feature branch.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' || vars.RETENTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: flask-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bounded cleanup
        env:
          DATABASE_URL: ${{ secrets.RETENTION_DATABASE_URL }}
          RETENTION_DATABASE_HOST: ${{ vars.RETENTION_DATABASE_HOST }}
          RETENTION_DATABASE_NAME: ${{ vars.RETENTION_DATABASE_NAME }}
          RETENTION_ENABLED: ${{ vars.RETENTION_ENABLED }}
          RUN_MODE: ${{ inputs.mode || 'apply' }}
        run: |
          set -euo pipefail
          case "$RUN_MODE" in
            preview) python cleanup_retention.py --max-rows 1000 ;;
            apply) python cleanup_retention.py --apply --max-rows 1000 ;;
            *) echo 'Unsupported retention mode' >&2; exit 1 ;;
          esac
